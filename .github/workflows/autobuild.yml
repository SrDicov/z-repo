name: Z Repo Autobuild (glibc)

on:
  push:
    branches: [master, main]
    paths:
      - '.github/**'
      - 'keys/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Build only these (comma/space separated, empty = auto-detect)'
        required: false
        default: ''
      sync_only:
        description: 'Skip build, only resign repodata and re-publish'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      resign:
        description: 'Wipe old signatures and sign everything from scratch (key rotation)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force:
        description: 'Rebuild all packages even if current'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      fail_on_build_error:
        description: 'Fail the job when any package build fails (default keeps current behavior; publish still runs)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      fail_on_fetch_error:
        description: 'Fail the job when failures are only transient distfile fetch/network errors (requires fail_on_build_error=true)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  schedule:
    - cron: '0 3 * * *' # daily: poll z-packages
  repository_dispatch:
    types: [z-packages-update]

env:
  ARCH: x86_64
  REPO_TAG: stable
  GH_REPO: ${{ github.repository }} # gh inside z-packages/ clone must target this repo

concurrency:
  group: z-repo-autobuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: Detect outdated packages
    runs-on: ubuntu-latest
    outputs:
      pkgs: ${{ steps.detect.outputs.pkgs }}
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: List release assets (no download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view "$REPO_TAG" --json assets \
            --jq '.assets[].name' > assets.txt 2>/dev/null \
            || : > assets.txt
          wc -l assets.txt

      - name: Clone z-packages (treeless)
        run: |
          git clone --filter=tree:0 --depth 1 \
            https://github.com/SrDicov/z-packages.git z-packages

      - name: Lint templates (fail fast)
        run: |
          # Catches dep-name, autodetect, hostdep, distfile and checksum
          # mistakes before a 30-40 min build wastes the runner.
          # Advisory only (`|| true`): the dep-name rules need the
          # void-packages tree, which this job does not have, so a
          # missing index must not fail an otherwise-good build.
          set -e
          git -C z-packages sparse-checkout init --cone 2>/dev/null || true
          git -C z-packages sparse-checkout set srcpkgs common 2>/dev/null || true
          python3 z-packages/common/scripts/lint-templates z-packages/srcpkgs \
            || echo "::warning::lint-templates findings above (advisory)"

      - name: Detect outdated
        id: detect
        run: |
          set -e
          out=$(python3 .github/scripts/check_outdated.py \
            z-packages/srcpkgs assets.txt --arch="$ARCH")
          echo "$out"
          auto=$(echo "$out" | sed -n 's/^pkgs://p')
          if [ "${{ inputs.sync_only }}" = "true" ]; then
            pkgs=""
          elif [ -n "${{ inputs.packages }}" ]; then
            pkgs=$(echo "${{ inputs.packages }}" | tr ',' ' ')
          elif [ "${{ inputs.force }}" = "true" ]; then
            pkgs=$(python3 .github/scripts/check_outdated.py \
              z-packages/srcpkgs assets.txt --arch="$ARCH" --force \
              | sed -n 's/^pkgs://p')
          else
            pkgs="$auto"
          fi
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          [ -n "$pkgs" ] || echo "All binpkgs current, build will skip."

  build:
    name: Build and publish (glibc)
    needs: check
    if: needs.check.outputs.pkgs != '' || inputs.sync_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: x86_64
        BOOTSTRAP: x86_64
    steps:
      - name: Checkout z-repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare container (no full upgrade)
        run: |
          set -e
          # /bin/sh is dash in the Void image and it has no bash yet, so no
          # `set -o pipefail` here (it aborts the step under dash).
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/ 2>/dev/null || true
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf 2>/dev/null || true
          xbps-install -Syu xbps 2>&1 | tail -n 3 || true
          xbps-install -y sudo bash curl git perl tar xz github-cli python3 ccache xbps-triggers bsdtar openssh openssl 2>&1 | tail -n 3
          useradd -G xbuilder -M builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          git config --global --add safe.directory '*'
          git config --system --add safe.directory '*'

      - name: Allow unprivileged userns (Ubuntu 24.04 fix)
        run: |
          echo 0 | tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo "no apparmor file"
          sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true

      - name: Clone z-packages (treeless)
        run: |
          rm -rf z-packages
          git clone --filter=tree:0 --depth 1 \
            https://github.com/SrDicov/z-packages.git z-packages
          echo "commit: $(git -C z-packages rev-parse --short HEAD)"

      - name: Restore xbps caches
        uses: actions/cache@v4
        with:
          path: |
            z-packages/hostdir/sources
            z-packages/hostdir/ccache
          key: glibc-xbps-v1
          restore-keys: glibc-xbps-

      - name: Configure z-packages
        run: |
          chown -R builder:builder . z-packages
          sudo -Eu builder mkdir -p z-packages/hostdir/binpkgs/x86_64 \
            z-packages/hostdir/sources z-packages/hostdir/ccache
          sudo -Eu builder bash -c 'cd z-packages && common/travis/set_mirror.sh 2>/dev/null || true'
          sudo -Eu builder bash -c 'cd z-packages && common/travis/fetch-xtools.sh 2>/dev/null || true'
          sudo -Eu builder bash -c 'cd z-packages && printf "%s\n" \
            XBPS_PRESERVE_PKGS=yes XBPS_CCACHE=yes \
            "XBPS_MAKEJOBS=$(nproc)" XBPS_ALLOW_RESTRICTED=yes >> etc/conf'

      - name: Seed binpkgs from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd z-packages/hostdir/binpkgs/x86_64
          if gh release view "$REPO_TAG" >/dev/null 2>&1; then
            # no `|| true`: a partial seed once starved the publish step
            # and it pruned packages it had never seen. If this download
            # fails, the run fails (publish still reports on always(),
            # and publish.sh no longer deletes unproven assets).
            gh release download "$REPO_TAG" --pattern '*.xbps*'
            # the index is what makes the seeded packages resolvable as a repo
            gh release download "$REPO_TAG" --pattern '*-repodata*'
          elif [ -d "$GITHUB_WORKSPACE/x86_64" ]; then
            # one-time migration: seed from git-committed binpkgs
            cp -v "$GITHUB_WORKSPACE"/x86_64/*.xbps . 2>/dev/null || true
          fi
          ls *.xbps 2>/dev/null | wc -l
          # xbps-src resolves runtime deps from the local repo root
          # (hostdir/binpkgs), not from this arch subdir. Index the seed
          # there so a published runtime dep is not rebuilt from source.
          mkdir -p ..
          ln -f ./*.xbps ../
          chown builder:builder ../*.xbps
          ( cd .. && sudo -u builder xbps-rindex -a ./*.xbps >/dev/null )
          if [ "${{ inputs.resign }}" = "true" ]; then
            echo "resign requested: wiping old signatures and repodata"
            rm -f *.sig2 *.sig *-repodata*
          fi

      - name: Bootstrap x86_64
        run: |
          for attempt in 1 2 3; do
            if sudo -Eu builder bash -c 'set -o pipefail; cd z-packages && ./xbps-src binary-bootstrap 2>&1 | tail -n 20'; then
              exit 0
            fi
            echo "bootstrap attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          exit 1

      # The seeded library packages still have to be visible to pkg-config and
      # the linker, which look at the build root, not at the masterdir. Install
      # only development and library packages (179MB) into the container root,
      # avoiding multi-gigabyte browser/app binaries (Brave, OnlyOffice, etc.)
      # that exhaust runner disk space.
      - name: Make seeded libraries visible to the build
        continue-on-error: true
        run: |
          set -u
          for f in z-packages/hostdir/binpkgs/x86_64/*-devel*.xbps \
                   z-packages/hostdir/binpkgs/x86_64/lib*.xbps \
                   z-packages/hostdir/binpkgs/x86_64/aquamarine*.xbps \
                   z-packages/hostdir/binpkgs/x86_64/hypr*.xbps \
                   z-packages/hostdir/binpkgs/x86_64/scenefx*.xbps \
                   z-packages/hostdir/binpkgs/x86_64/sdbus*.xbps; do
            [ -f "$f" ] || continue
            case "$f" in
              *hyprland-0*|*hyprland-devel-0*) ;; # core hyprland is needed
              *hyprland-preview*|*hypridle*|*hyprsunset*|*hyprpolkitagent*) continue ;; # skip standalone tools
            esac
            sudo bsdtar -xpf "$f" -C / 2>/dev/null || true
            sudo -Eu builder bsdtar -xpf "$f" -C z-packages/masterdir-x86_64 2>/dev/null || true
          done
          sudo ldconfig

      - name: Build packages
        id: build
        if: inputs.sync_only != 'true'
        shell: bash
        run: |
          set -e
          set -o pipefail
          PKGS="${{ needs.check.outputs.pkgs }}"
          echo "Packages to build: $PKGS"
          ls -l /usr/lib/libhyprutils* 2>&1 || echo "PROBE: libhyprutils gone"
          failed=""
          failed_fetch=""
          failed_other=""
          fetch_pattern='xbps-fetch: failed to fetch|Gateway Time-out|Connection timed out|Operation timed out|Could not resolve host|HTTP/[0-9.]+ 50[234]|Failed to connect|SSL|Temporary failure|transfer closed|recv failure'
          for pkg in $PKGS; do
            # symlinked subpackage dirs are built via their parent: skip
            if [ -L "z-packages/srcpkgs/$pkg" ]; then
              echo "=== Skipping $pkg (symlink, built with parent) ==="
              continue
            fi
            if [ ! -d "z-packages/srcpkgs/$pkg" ]; then
              echo "FAIL $pkg (no such template)"
              failed="$failed $pkg"
              failed_other="$failed_other $pkg"
              continue
            fi
            echo "=== Building $pkg (x86_64) ==="
            # Full log per package (uploaded as an artifact). On failure print
            # the first real ERROR lines: xbps-src's cleanup floods the tail
            # with [DEBUG] remove lines and hides the cause.
            mkdir -p z-packages/logs
            marker="z-packages/.build-start-$pkg"
            ok=no
            last_was_fetch=no
            for attempt in 1 2 3; do
              touch "$marker"
              if sudo -Eu builder bash -c "set -o pipefail; cd z-packages && ./xbps-src pkg $pkg" \
                   > "z-packages/logs/$pkg.log" 2>&1; then
                ok=yes
                break
              fi
              # Known xbps-src teardown bug: the seeded masterdir makes the
              # autodeps removal transaction fail after the package was
              # already created (only line: "Transaction failed"). Accept the
              # build only when the .xbps is new and that is the sole error.
              pkgfile=$(ls -t z-packages/hostdir/binpkgs/$pkg-*.xbps 2>/dev/null | head -n 1 || true)
              if [ -n "$pkgfile" ] && [ "$pkgfile" -nt "$marker" ] \
                   && grep -q 'ERROR: Transaction failed' "z-packages/logs/$pkg.log"; then
                echo "WARN $pkg: only the autodeps teardown failed; package was created"
                ok=yes
                break
              fi
              # Retry only on transient-looking fetch/download/network failures.
              # Real compile/template errors are not retried.
              if grep -Eq "$fetch_pattern" "z-packages/logs/$pkg.log"; then
                last_was_fetch=yes
                if [ "$attempt" -lt 3 ]; then
                  delay=$((20 * 3 ** (attempt - 1))) # 20s, 60s
                  echo "WARN $pkg: transient fetch/network failure (attempt $attempt), retrying in ${delay}s"
                  sleep "$delay"
                  continue
                fi
              else
                last_was_fetch=no
              fi
              break
            done
            if [ "$ok" != yes ]; then
              echo "FAIL $pkg"
              grep -nE "ERROR|error:|FAIL|not found|No such file|undefined reference|cannot" \
                "z-packages/logs/$pkg.log" | head -40 || true
              echo "--- last 40 lines ---"
              tail -n 40 "z-packages/logs/$pkg.log" || true
              failed="$failed $pkg"
              if [ "$last_was_fetch" = yes ]; then
                failed_fetch="$failed_fetch $pkg"
                echo "::warning::Package $pkg failed due to a fetch/network error after retries (often transient upstream/distfile issue; template/distfile may also need updating in z-packages)"
              else
                failed_other="$failed_other $pkg"
              fi
            fi
            # move built packages now: a later failure must not strand
            # them in the repo root, where publish.sh does not look
            if ls z-packages/hostdir/binpkgs/$pkg-*.xbps 1>/dev/null 2>&1; then
              mv z-packages/hostdir/binpkgs/$pkg-*.xbps z-packages/hostdir/binpkgs/x86_64/ 2>/dev/null || true
              mv z-packages/hostdir/binpkgs/$pkg-*.xbps.sig2 z-packages/hostdir/binpkgs/x86_64/ 2>/dev/null || true
            fi
          done
          [ -z "$failed" ] || echo "failed=$failed" >> "$GITHUB_OUTPUT"
          [ -z "$failed_fetch" ] || echo "failed_fetch=$failed_fetch" >> "$GITHUB_OUTPUT"
          [ -z "$failed_other" ] || echo "failed_other=$failed_other" >> "$GITHUB_OUTPUT"
          if [ -n "$failed_other" ]; then
            echo "::error::FAILED packages (build/template/other):$failed_other (publishing partial results anyway)"
          fi
          if [ -n "$failed_fetch" ]; then
            echo "::warning::FAILED packages (fetch/network):$failed_fetch (publishing partial results anyway)"
          fi

      - name: Publish to release (always, even on build failure)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
          RESIGN: ${{ inputs.resign }}
        shell: bash
        run: |
          bash .github/scripts/publish.sh z-packages/hostdir/binpkgs/x86_64
          failed="${{ steps.build.outputs.failed }}"
          failed_fetch="${{ steps.build.outputs.failed_fetch }}"
          failed_other="${{ steps.build.outputs.failed_other }}"
          if [ -n "$failed" ]; then
            echo "::notice::Partial publish completed. Failed packages:$failed"
            [ -z "$failed_fetch" ] || echo "::notice::Fetch/network failures:$failed_fetch"
            [ -z "$failed_other" ] || echo "::notice::Non-fetch failures:$failed_other"
            fail_on_err="${{ inputs.fail_on_build_error }}"
            fail_on_fetch="${{ inputs.fail_on_fetch_error }}"
            [ -n "$fail_on_err" ] || fail_on_err="true"
            [ -n "$fail_on_fetch" ] || fail_on_fetch="true"
            if [ "$fail_on_err" != "true" ]; then
              echo "::warning::fail_on_build_error=false; exiting successfully despite failed packages"
              exit 0
            fi
            if [ -z "$failed_other" ] && [ -n "$failed_fetch" ] && [ "$fail_on_fetch" != "true" ]; then
              echo "::warning::Only fetch/network failures occurred and fail_on_fetch_error=false; exiting successfully after partial publish"
              exit 0
            fi
            echo "::error::FAILED packages:$failed (partial results published)"
            exit 1
          fi

      - name: Upload build logs (always)
        if: always() && inputs.sync_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: z-packages/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save xbps caches (always, even on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            z-packages/hostdir/sources
            z-packages/hostdir/ccache
          key: glibc-xbps-v1-${{ github.run_id }}
